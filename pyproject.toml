[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-orchestrator"
version = "0.1.0"
description = "Deterministic Codex skill, hooks and hierarchical implementation/review workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-orchestrator = "codex_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["codex_orchestrator*"]

[tool.setuptools.package-data]
codex_orchestrator = ["assets/*.md"]
